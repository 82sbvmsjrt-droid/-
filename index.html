<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>REFLECT! | 2 PLAYER BATTLE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;justify-content:center}
main{width:min(100%,520px);padding:12px 0 18px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;text-align:center}
.score{font-size:27px;font-weight:850}.muted{font-size:11px;color:#a9b8ce}#status{font-size:13px;font-weight:700}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;border:1px solid #50617a;border-radius:14px;background:#101b30;touch-action:none}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{background:#17243a;border-radius:12px;padding:10px;text-align:center}
.p1{color:#60a5fa}.p2{color:#fb923c}.moves{display:flex;gap:8px;margin-top:8px}
.move{flex:1;min-height:54px;border:0;border-radius:10px;background:#2855a5;color:white;font-size:25px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}
.orange{background:#a94c12}.move:active{filter:brightness(1.4)}
button{font:inherit}#reset{border:1px solid #53647c;background:#1a2a40;color:white;border-radius:10px;padding:11px}
#overlay{position:fixed;inset:0;background:#07101ddd;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
#panel{background:#17243a;border:1px solid #53647c;border-radius:18px;padding:26px 20px;text-align:center;width:min(100%,350px)}
#panel h1{margin:0 0 8px;font-size:30px}#panel p{color:#d1d9e6;line-height:1.7}
#start{background:#2563eb;color:white;border:0;border-radius:12px;padding:14px 24px;font-weight:750;font-size:16px;width:100%}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<header>
 <div><div class="muted p1">PLAYER 1 · 上側</div><div class="score" id="score1">0</div></div>
 <div><div class="muted">2人対戦</div><div id="status">スタンバイ</div></div>
 <div><div class="muted p2">PLAYER 2 · 下側</div><div class="score" id="score2">0</div></div>
</header>
<canvas id="arena" width="400" height="500"></canvas>
<div class="controls">
 <section class="player"><b class="p1">PLAYER 1</b><div class="muted">上のバーを操作</div><div class="moves"><button class="move" id="p1L">◀</button><button class="move" id="p1R">▶</button></div></section>
 <section class="player"><b class="p2">PLAYER 2</b><div class="muted">下のバーを操作</div><div class="moves"><button class="move orange" id="p2L">◀</button><button class="move orange" id="p2R">▶</button></div></section>
</div>
<div class="muted" style="text-align:center">ボタンを押している間、バーが動くよ</div>
<button id="reset">スコアをリセット</button>
</main>
<div id="overlay"><div id="panel"><h1>REFLECT!</h1><p id="message">相手側の壁にボールを到達させよう！<br>自分側の壁に触れたら負け。</p><button id="start">ゲームスタート</button></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),c=$('arena'),ctx=c.getContext('2d');
const W=400,H=500,PW=96,PH=12;let p1=152,p2=152;
let ball={x:200,y:250,vx:3.2,vy:3.5,r:8},held={p1L:false,p1R:false,p2L:false,p2R:false};
let s1=0,s2=0,running=false,raf=0,last=0;
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#101b30';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#60718c';ctx.globalAlpha=.5;ctx.setLineDash([7,8]);ctx.beginPath();ctx.moveTo(0,250);ctx.lineTo(400,250);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
 ctx.fillStyle='#60a5fa';ctx.fillRect(p1,18,PW,PH);ctx.fillStyle='#fb923c';ctx.fillRect(p2,470,PW,PH);
 ctx.font='bold 12px system-ui';ctx.fillStyle='#60a5fa';ctx.fillText('PLAYER 1',12,14);ctx.fillStyle='#fb923c';ctx.fillText('PLAYER 2',12,460);
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='white';ctx.shadowColor='white';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
}
function serve(){ball={x:200,y:250,vx:(Math.random()<.5?-1:1)*3.2,vy:(Math.random()<.5?-1:1)*3.5,r:8}}
function end(w){running=false;cancelAnimationFrame(raf);$('status').textContent=w+' WIN';$('message').textContent=w+' の勝利！';$('start').textContent='もう一度プレイ';$('overlay').classList.remove('hidden')}
function loop(t){
 if(!running)return;const dt=Math.min((t-last||16.67)/16.67,2);last=t;const speed=5.4*dt;
 if(held.p1L)p1-=speed;if(held.p1R)p1+=speed;if(held.p2L)p2-=speed;if(held.p2R)p2+=speed;
 p1=Math.max(0,Math.min(W-PW,p1));p2=Math.max(0,Math.min(W-PW,p2));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
 if(ball.vy<0&&ball.y-ball.r<=30&&ball.y>15&&ball.x>=p1-5&&ball.x<=p1+PW+5){ball.y=38;ball.vy=Math.abs(ball.vy)*1.025;ball.vx+=(ball.x-(p1+PW/2))/45}
 if(ball.vy>0&&ball.y+ball.r>=470&&ball.y<485&&ball.x>=p2-5&&ball.x<=p2+PW+5){ball.y=462;ball.vy=-Math.abs(ball.vy)*1.025;ball.vx+=(ball.x-(p2+PW/2))/45}
 if(ball.y<0){s2++;$('score2').textContent=s2;end('PLAYER 2')}else if(ball.y>H){s1++;$('score1').textContent=s1;end('PLAYER 1')}
 ball.vx=Math.max(-7,Math.min(7,ball.vx));draw();if(running)raf=requestAnimationFrame(loop)
}
function start(){cancelAnimationFrame(raf);p1=p2=(W-PW)/2;serve();last=0;running=true;$('status').textContent='対戦中';$('overlay').classList.add('hidden');draw();raf=requestAnimationFrame(loop)}
function bind(id,k){const el=$(id);const down=e=>{e.preventDefault();held[k]=true};const up=e=>{e.preventDefault();held[k]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(v=>el.addEventListener(v,up))}
['p1L','p1R','p2L','p2R'].forEach(k=>bind(k,k));
$('start').addEventListener('click',start);
$('reset').addEventListener('click',()=>{s1=s2=0;$('score1').textContent='0';$('score2').textContent='0';running=false;cancelAnimationFrame(raf);$('status').textContent='スタンバイ';$('message').innerHTML='相手側の壁にボールを到達させよう！<br>自分側の壁に触れたら負け。';$('start').textContent='ゲームスタート';$('overlay').classList.remove('hidden');serve();draw()});
window.addEventListener('blur',()=>Object.keys(held).forEach(k=>held[k]=false));draw();
})();
</script>
</body></html>
